<!DOCTYPE html>
<html>
<head>
    <title>University Profile</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 0 auto; padding: 20px; }
        input { padding: 10px; font-size: 16px; width: 300px; }
        button { padding: 10px 20px; cursor: pointer; background: #0066cc; color: white; border: none; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 10px; margin-top: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; }
        img { width: 100%; }
        .source { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>University Image Profile</h1>
    <input id="uni" placeholder="Enter university name" />
    <button onclick="search()">Search</button>
    
    <div id="result"></div>

    <script>
        async function search() {
            const uni = document.getElementById("uni").value;
            const res = await fetch("/search?university_name=" + uni, {method: "POST"});
            const data = await res.json();
            
            let html = '<div class="gallery">';
            data.images.forEach(img => {
                html += `<div class="card">
                    <img src="${img.url}" onerror="this.style.display='none'" />
                    <div class="source">${img.source}</div>
                </div>`;
            });
            html += '</div>';
            
            document.getElementById("result").innerHTML = html;
        }
    </script>
</body>
</html>
